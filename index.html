<!doctype html>
<html lang="en">
<head>

<div id="home"><button id="open">📍 Open Route Navigator</button><div>Route Navigator</div></div>

function rnOpen(){var s=document.createElement('script');s.src='routenav.js?v='+Date.now();document.body.appendChild(s);}
document.getElementById('open').onclick=rnOpen;
